<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cadastro de leitor | Biblioteca.web</title><link rel="stylesheet" th:href="@{/css/estilo.css}"></head>
<body>
<div th:replace="~{fragments/layout :: cabecalho('leitores')}"></div>
<main class="container">
    <a class="voltar" th:href="@{/leitores}">← Voltar aos leitores</a>
    <div class="pagina-topo"><div><h1 th:text="${id == null} ? 'Novo Leitor' : 'Editar Leitor'"></h1><p>Informe os dados de contato e identificação.</p></div></div>
    <section class="painel"><form th:action="@{/leitores/salvar}" th:object="${form}" method="post">
        <input type="hidden" name="id" th:value="${id}"><div class="alert erro" th:if="${#fields.hasGlobalErrors()}" th:each="falha : ${#fields.globalErrors()}" th:text="${falha}"></div>
        <div class="form-grid">
            <div class="campo"><label for="nome">Nome completo</label><input type="text" id="nome" th:field="*{nome}" placeholder="Nome completo" maxlength="150" required><span class="erro-campo" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span></div>
            <div class="campo"><label for="cpf">CPF</label><input type="text" id="cpf" th:field="*{cpf}" placeholder="000.000.000-00" maxlength="14" required><span class="erro-campo" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}"></span></div>
            <div class="campo"><label for="email">E-mail</label><input type="email" id="email" th:field="*{email}" placeholder="email@exemplo.com" maxlength="150" required><span class="erro-campo" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span></div>
            <div class="campo"><label for="telefone">Telefone</label><input type="tel" id="telefone" th:field="*{telefone}" placeholder="(00) 00000-0000" maxlength="20" required><span class="erro-campo" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}"></span></div>
        </div>
        <div class="form-acoes"><a class="btn btn-secondary" th:href="@{/leitores}">Cancelar</a><button class="btn btn-green" type="submit">Salvar Leitor</button></div>
    </form></section>
</main>
<div th:replace="~{fragments/layout :: rodape}"></div>
</body>
</html>

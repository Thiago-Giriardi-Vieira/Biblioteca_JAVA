<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="cabecalho(ativo)" class="site-header">
    <div class="header-inner">
        <a class="marca" th:href="@{/}"><span class="marca-icone">▤</span><span>Biblioteca<span class="marca-destaque">.web</span></span></a>
        <nav aria-label="Navegação principal" class="nav">
            <a th:href="@{/}" th:classappend="${ativo == 'inicio'} ? 'selecionado' : ''">Início</a>
            <a th:href="@{/livros}" th:classappend="${ativo == 'livros'} ? 'selecionado' : ''">Livros</a>
            <a th:href="@{/autores}" th:classappend="${ativo == 'autores'} ? 'selecionado' : ''">Autores</a>
            <a th:href="@{/leitores}" th:classappend="${ativo == 'leitores'} ? 'selecionado' : ''">Leitores</a>
            <a th:href="@{/emprestimos}" th:classappend="${ativo == 'emprestimos'} ? 'selecionado' : ''">Empréstimos</a>
        </nav>
    </div>
</header>
<div th:fragment="alertas">
    <div class="alert sucesso" role="status" th:if="${sucesso}" th:text="${sucesso}"></div>
    <div class="alert erro" role="alert" th:if="${erro}" th:text="${erro}"></div>
</div>
<footer th:fragment="rodape" class="rodape">Sistema Web de Gestão de Biblioteca · Spring Boot MVC</footer>
</body>
</html>
